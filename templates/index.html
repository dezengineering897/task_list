<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Task & Grocery Dashboard</title>

  <!-- EMAILJS SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <!-- DOCX GENERATOR LIBRARY -->
  <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 2rem; }
    .container { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 2rem; }

    header { display: flex; flex-direction: column; gap: 1rem; border-bottom: 2px solid var(--border); padding-bottom: 1rem; }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .header-controls { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }

    h1 { font-size: 1.8rem; font-weight: 700; color: var(--primary); }
    button { cursor: pointer; padding: 0.6rem 1.2rem; border-radius: var(--radius); border: none; font-weight: 600; transition: background 0.2s; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--border); color: var(--text); }
    .btn-danger { background: var(--danger); color: white; }
    .btn-success { background: var(--success); color: white; }
    .btn-export { background: #0284c7; color: white; }
    .btn-export:hover { background: #0369a1; }

    .file-status { font-size: 0.85rem; font-weight: 600; padding: 0.4rem 0.8rem; border-radius: 6px; background: #e2e8f0; color: var(--text-muted); }
    .file-status.connected { background: #d1fae5; color: #065f46; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
    @media (max-width: 850px) { .grid { grid-template-columns: 1fr; } }

    .card { background: var(--card-bg); padding: 1.5rem; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .card h2 { font-size: 1.3rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }

    form { display: flex; flex-direction: column; gap: 0.8rem; margin-bottom: 1.5rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.3rem; }
    .form-row { display: flex; gap: 0.5rem; }
    label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }
    input, select { padding: 0.6rem; border-radius: 6px; border: 1px solid var(--border); font-size: 0.95rem; width: 100%; }

    ul { list-style: none; display: flex; flex-direction: column; gap: 0.8rem; }
    li { background: var(--bg); padding: 1rem; border-radius: 8px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    .item-info { display: flex; flex-direction: column; gap: 0.2rem; }
    .item-title { font-weight: 600; }
    .item-meta { font-size: 0.8rem; color: var(--text-muted); }
    .item-actions { display: flex; gap: 0.4rem; }

    .badge { padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
    .badge-expired { background: #fee2e2; color: var(--danger); }
    .badge-recurring { background: #e0e7ff; color: var(--primary); }

    .category-block { margin-top: 1rem; padding-top: 1rem; border-top: 1px dashed var(--border); }
    .category-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
    .category-header h3 { font-size: 1rem; text-transform: capitalize; color: var(--primary); }

    .stock-bar { height: 6px; width: 140px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 0.2rem; }
    .stock-bar-fill { height: 100%; background: var(--success); }
    .stock-bar-fill.low { background: var(--danger); }
    .stock-bar-fill.mid { background: var(--warning); }
    .stock-edit { display: flex; align-items: center; gap: 0.2rem; }
    .stock-edit input { width: 4.2rem; padding: 0.4rem; font-size: 0.85rem; }
    .stock-edit span { font-size: 0.85rem; color: var(--text-muted); }

    .collapsible-settings { margin-bottom: 1rem; background: #eef2ff; border: 1px solid #c7d2fe; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-top">
      <h1>Task & Grocery Hub</h1>
      <button id="notify-btn" class="btn-secondary" onclick="requestNotificationPermission()">Enable Notifications</button>
    </div>

    <!-- EXPORT CONTROLS (data itself now lives server-side in SQLite) -->
    <div class="header-controls">
      <button class="btn-export" onclick="exportAsTXT()">📥 Download .TXT</button>
      <button class="btn-export" onclick="exportAsDOCX()">📄 Download .DOCX</button>
      <span id="db-status-indicator" class="file-status">Loading…</span>
    </div>
  </header>

  <!-- EMAILJS STATUS (read-only — settings come from the .env file) -->
  <div class="card collapsible-settings">
    <h2>📧 Email Alerts</h2>
    <p id="email-status" class="item-meta">Checking EmailJS configuration…</p>
  </div>

  <div class="grid">
    <!-- TASK SECTION -->
    <div class="card">
      <h2>Active Tasks</h2>
      <form id="task-form">
        <div class="form-group">
          <label>Task Name</label>
          <input type="text" id="task-title" required placeholder="e.g. Submit Quarterly Report">
        </div>
        <div class="form-row">
          <div class="form-group" style="flex: 1;">
            <label>Due Date</label>
            <input type="datetime-local" id="task-due" required>
          </div>
          <div class="form-group" style="flex: 1;">
            <label>Reminder Interval</label>
            <select id="task-interval">
              <option value="none">None</option>
              <option value="15">Every 15 mins</option>
              <option value="60">Every 1 hour</option>
              <option value="1440">Every 24 hours</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Repeat Rule</label>
          <select id="task-repeat">
            <option value="none">Does not repeat</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
          </select>
        </div>
        <button type="submit" class="btn-primary">Add Task</button>
      </form>

      <ul id="active-tasks-list"></ul>

      <h2 style="margin-top: 2rem; color: var(--danger);">Uncompleted / Expired Tasks</h2>
      <p style="font-size:0.8rem; color: var(--text-muted); margin-bottom:0.5rem;">Tasks expired for 2+ days move here automatically.</p>
      <ul id="uncompleted-tasks-list"></ul>
    </div>

    <!-- GROCERY SECTION -->
    <div class="card">
      <h2>Grocery Depletion Tracker</h2>
      <form id="grocery-form">
        <div class="form-group">
          <label>Item Name</label>
          <input type="text" id="grocery-title" required placeholder="e.g. Almond Milk">
        </div>
        <div class="form-row">
          <div class="form-group" style="flex: 1;">
            <label>Category</label>
            <select id="grocery-category">
              <option value="food">Food</option>
              <option value="bathroom">Bathroom</option>
              <option value="hygiene">Hygiene</option>
              <option value="snacks">Snacks</option>
              <option value="drinks">Drinks</option>
              <option value="household">Household Item</option>
            </select>
          </div>
          <div class="form-group" style="flex: 1;">
            <label>Depletion Speed (Days to empty)</label>
            <input type="number" id="grocery-days" min="1" value="7" required>
          </div>
          <div class="form-group" style="flex: 1;">
            <label>Current Stock (%)</label>
            <input type="number" id="grocery-stock" min="0" max="100" step="1" value="100" required>
          </div>
        </div>
        <button type="submit" class="btn-primary">Add Item</button>
      </form>

      <div id="grocery-categories-container"></div>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
