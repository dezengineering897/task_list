services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      # Compose automatically reads a .env file in this directory (if
      # present) to fill in ${...} references below. The :- defaults mean
      # `docker compose up` still works fine with no .env file at all.
      - PORT=5000
      - EMAILJS_PUBLIC_KEY=${EMAILJS_PUBLIC_KEY:-}
      - EMAILJS_SERVICE_ID=${EMAILJS_SERVICE_ID:-}
      - EMAILJS_TEMPLATE_ID=${EMAILJS_TEMPLATE_ID:-}
      - EMAILJS_USER_EMAIL=${EMAILJS_USER_EMAIL:-}
    volumes:
      - db-data:/app/data
    restart: unless-stopped

volumes:
  db-data: